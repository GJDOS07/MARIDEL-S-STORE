services:
  - type: web
    name: maridel-s-store-api-gjdos07
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: OWNER_SESSION_SECRET
        sync: false
